async function loadTool(card,name){if(card.dataset.loaded==='1')return;const wrap=card.querySelector('.frame-wrap');wrap.innerHTML='<div class="loading">正在加载工具……</div>';try{const r=await fetch(encodeURI(name));if(!r.ok)throw Error();const source=normalizeSource(await r.text()),f=document.createElement('iframe');f.className='tool-frame';f.title=name;f.setAttribute('sandbox','allow-scripts allow-forms allow-modals allow-downloads');f.srcdoc='<!DOCTYPE html><html lang="zh-CN"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:12px;box-sizing:border-box}*,*:before,*:after{box-sizing:border-box}</style></head><body>'+source+'</body></html>';wrap.innerHTML='';wrap.appendChild(f);card.dataset.loaded='1'}catch(e){wrap.innerHTML='<div class="loading">工具暂时无法加载，请刷新页面后重试。</div>'}}
