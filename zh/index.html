const sections=document.getElementById('sections'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty'),buttons=[...document.querySelectorAll('.filter')];let active='all';function typeLabel(n){if(n.includes('计算器'))return'计算器';if(n.includes('清单'))return'检查清单';if(n.includes('评估'))return'评估工具';if(n.includes('查询'))return'查询工具';return'实用工具'}function normalizeSource(t){t=t.trim();if(t.startsWith('"')&&t.endsWith('"'))t=t.slice(1,-1);return t.replace(/""/g,'"')}async function loadTool(card,name){if(card.dataset.loaded==='1')return;const w=card.querySelector('.frame-wrap');w.innerHTML='<div class="loading">正在加载工具……</div>';try{const r=await fetch(encodeURI(name));if(!r.ok)throw Error();const s=normalizeSource(await r.text()),f=document.createElement('iframe');f.className='tool-frame';f.title=name;f.setAttribute('sandbox','allow-scripts allow-forms allow-modals allow-downloads');f.srcdoc='<!DOCTYPE html><html lang="zh-CN"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:10px;box-sizing:border-box}*,*:before,*:after{box-sizing:border-box}</style></head><body>'+s+'</body></html>';w.innerHTML='';w.appendChild(f);card.dataset.loaded='1'}catch(e){w.innerHTML='<div class="loading">工具暂时无法加载，请刷新页面后重试。</div>'}}function makeCard(n,c,d){const card=document.createElement('article');card.className='tool-card';card.innerHTML=`<div class="card-front" tabindex="0" role="button" aria-expanded="false"><div class="badge">${typeLabel(n)}</div><h3>${n}</h3><p>${d}</p><span class="use">使用工具</span></div><div class="tool-panel"><div class="toolbar"><strong>${n}</strong><button class="close">← 返回工具列表</button></div><div class="frame-wrap"><div class="loading">正在加载工具……</div></div></div>`;const front=card.querySelector('.card-front'),open=()=>{document.querySelectorAll('.tool-card.open').forEach(x=>{x.classList.remove('open');x.querySelector('.card-front')?.setAttribute('aria-expanded','false')});card.classList.add('open');front.setAttribute('aria-expanded','true');loadTool(card,n);setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'start'}),80)};front.onclick=open;front.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};card.querySelector('.close').onclick=()=>{card.classList.remove('open');front.setAttribute('aria-expanded','false');setTimeout(()=>front.focus({preventScroll:true}),50)};return card}function render(){const q=search.value.trim().toLowerCase();sections.innerHTML='';let total=0;Object.entries(groups).forEach(([key,g])=>{if(active!=='all'&&active!==key)return;const list=tools.filter(([n,c,d])=>c===key&&(!q||(n+d).toLowerCase().includes(q)));if(!list.length)return;total+=list.length;const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="section-head"><div><h2>${g.title}</h2><p>${g.desc}</p></div><div class="section-count">${list.length} 个工具</div></div><div class="grid"></div>`;list.forEach(t=>sec.querySelector('.grid').appendChild(makeCard(...t)));sections.appendChild(sec)});count.textContent=total;empty.style.display=total?'none':'block'}buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render()});search.oninput=render;render();
